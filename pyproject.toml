[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/documented_dataset"
]

[project]
name = "documented_dataset"
version = "0.0.15"
requires-python = ">= 3.12"
authors = [
    {name = "Autumn Battisti", email = "battisti456@gmail.com"}
]
description = "A module defining a specific data structure for easier documentation of data."
readme = "README.md"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "xarray",
    "h5netcdf",
    "h5py"
]

[project.urls]
Homepage = "https://github.com/battisti456/pl_data_tools"
